<style>
  :root{--navy:#02243A;--pink:#EE235C;--cream:#F6F1EA;--ink2:#546270}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--navy);color:#fff;font:400 16px/1.65 Poppins,system-ui,sans-serif}
  header{padding:26px 40px}
  header a{display:inline-block}
  header svg{height:44px;width:auto}
  main{flex:1;display:grid;place-items:center;padding:24px 16px 80px}
  .box{max-width:640px;text-align:center}
  .ok{width:84px;height:84px;border-radius:50%;background:var(--pink);display:grid;place-items:center;margin:0 auto 34px;animation:pop .7s cubic-bezier(.34,1.8,.64,1) both}
  .ok svg{width:38px;height:38px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s ease .45s forwards}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  h1{font-family:Gelasio,Georgia,serif;font-weight:500;font-size:clamp(44px,7vw,80px);line-height:1;letter-spacing:-.02em;margin:0 0 22px}
  h1 em{color:var(--pink)}
  p{color:#B9C3CC;font-size:17px;margin:0 auto 36px;max-width:480px}
  .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;transition:transform .3s}
  .btn:hover{transform:translateY(-2px)}
  .wa{background:#25D366;color:#fff}
  .wa svg{width:20px;height:20px;fill:#fff}
  .alt{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
  footer{padding:22px 40px;font-size:13px;color:#8FA0AE;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1)}
  footer a{color:inherit;text-decoration:none}
  @media (max-width:600px){header,footer{padding-left:16px;padding-right:16px}}
  @media (prefers-reduced-motion:reduce){.ok,.ok svg{animation:none;stroke-dashoffset:0}}
</style>
</head>
